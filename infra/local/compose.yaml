name: legalitt-local
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: legalitt
      POSTGRES_DB: legalitt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres16:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalitt -d legalitt"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres16:
